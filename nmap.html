<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body,#map{height:100%;margin:0;padding:0;}
.leaflet-control-zoom{display:none;}
.custom-pin{
  width:28px;height:36px;
  background:#18351d;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  position:relative;
}
.custom-pin::after{
  content:'';
  width:12px;height:12px;
  background:#e3ded6;
  border-radius:50%;
  position:absolute;
  top:8px;left:8px;
}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {
  center: [37.4806, 126.9963],
  zoom: 15,
  zoomControl: false,
  scrollWheelZoom: true,
  dragging: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

var icon = L.divIcon({
  html: '<div class="custom-pin"><div style="width:12px;height:12px;background:#e3ded6;border-radius:50%;position:absolute;top:8px;left:8px;"></div></div>',
  iconSize: [28, 36],
  iconAnchor: [14, 36],
  popupAnchor: [0, -36],
  className: ''
});

L.marker([37.4789743, 126.9990044], {icon: icon})
  .addTo(map)
  .bindPopup('<b style="font-size:13px;font-family:sans-serif">오드힐하우스</b><br><span style="font-size:11px;color:#666">서울 서초구 방배로 47</span>', {offset:[0,0]})
  .openPopup();
</script>
</body>
</html>
